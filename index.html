<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cursor Gaze</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87030a;
      touch-action: none;
      cursor: crosshair;
      -webkit-user-select: none;
      user-select: none;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: #87030a;
      overflow: hidden;
    }
    #bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(60px) saturate(1.3) brightness(0.95);
      transform: scale(1.15);
    }
    video {
      position: relative;
      display: block;
      pointer-events: none;
      object-fit: fill;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="bg"></canvas>
    <video id="vid" src="character-scrub.mp4" muted playsinline preload="auto"></video>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const video = document.getElementById('vid');
    const bg = document.getElementById('bg');
    const bgCtx = bg.getContext('2d');

    let nativeRatio = 1280 / 704;

    function layout() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      let w, h;
      if (vw / vh > nativeRatio) {
        h = vh;
        w = Math.round(h * nativeRatio);
      } else {
        w = vw;
        h = Math.round(w / nativeRatio);
      }
      video.style.width = w + 'px';
      video.style.height = h + 'px';
      bg.width = Math.max(1, Math.round(vw / 4));
      bg.height = Math.max(1, Math.round(vh / 4));
      bg.style.width = vw + 'px';
      bg.style.height = vh + 'px';
    }

    video.addEventListener('loadedmetadata', () => {
      if (video.videoWidth && video.videoHeight) nativeRatio = video.videoWidth / video.videoHeight;
      layout();
    });
    window.addEventListener('resize', layout);
    layout();

    function drawAmbient() {
      if (video.readyState >= 2 && video.videoWidth) {
        const vAspect = video.videoWidth / video.videoHeight;
        const cAspect = bg.width / bg.height;
        let sw, sh, sx, sy;
        if (vAspect > cAspect) {
          sh = video.videoHeight;
          sw = sh * cAspect;
          sx = (video.videoWidth - sw) / 2;
          sy = 0;
        } else {
          sw = video.videoWidth;
          sh = sw / cAspect;
          sx = 0;
          sy = (video.videoHeight - sh) / 2;
        }
        try { bgCtx.drawImage(video, sx, sy, sw, sh, 0, 0, bg.width, bg.height); } catch (e) {}
      }
    }

    // ---------------------------------------------------------------
    // Sequential clip keyframes (neutral → left → right → up → down).
    // Timeline is NOT circular, so we snap to the nearest cardinal
    // direction instead of lerping across unrelated poses.
    // ---------------------------------------------------------------
    const KEYS = [
      { angle: 0,   t: 6.6  },  // right
      { angle: 90,  t: 9.85 },  // down  (near end)
      { angle: 180, t: 2.7  },  // left
      { angle: 270, t: 8.58 },  // up
    ];
    const NEUTRAL_T = 0.15;
    const DEADZONE = 0.08;   // smaller so up/down engage sooner

    let seeking = false;
    video.addEventListener('seeking', () => { seeking = true; });
    video.addEventListener('seeked', () => { seeking = false; });
    let ready = false;
    video.addEventListener('loadedmetadata', () => { ready = true; });
    video.addEventListener('canplaythrough', () => { ready = true; });
    setTimeout(() => { ready = true; }, 1500);

    let current = 0;
    let target = 0;
    const TAU = 0.16; // snappier response

    function angleDiff(a, b) {
      return ((a - b) % 360 + 540) % 360 - 180;
    }

    function updateTarget(clientX, clientY) {
      const rect = stage.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = clientX - cx;
      const dy = clientY - cy;

      // Independent axis norm so top/bottom edges reach full strength
      // on wide screens (vertical travel is shorter than horizontal).
      const normX = Math.abs(dx) / Math.max(1, rect.width / 2);
      const normY = Math.abs(dy) / Math.max(1, rect.height / 2);
      // Boost vertical slightly — users report up/down felt weak
      const norm = Math.min(1, Math.max(normX, normY * 1.15));

      let angle = Math.atan2(dy, dx) * 180 / Math.PI;
      if (angle < 0) angle += 360;

      // Nearest cardinal key by angular distance (no cross-timeline lerp)
      let bestI = 0;
      let bestD = 999;
      for (let i = 0; i < KEYS.length; i++) {
        const d = Math.abs(angleDiff(angle, KEYS[i].angle));
        if (d < bestD) {
          bestD = d;
          bestI = i;
        }
      }
      const angleTarget = KEYS[bestI].t;

      const deadT = Math.max(0, Math.min(1, (norm - DEADZONE) / (1 - DEADZONE)));
      // smoothstep for gentler falloff near center
      const eased = deadT * deadT * (3 - 2 * deadT);
      target = NEUTRAL_T + (angleTarget - NEUTRAL_T) * eased;
    }

    window.addEventListener('pointermove', (e) => updateTarget(e.clientX, e.clientY), { passive: true });
    window.addEventListener('pointerdown', (e) => updateTarget(e.clientX, e.clientY), { passive: true });

    function tick() {
      if (ready && Number.isFinite(video.duration) && video.duration > 0) {
        const alpha = 1 - Math.exp(-(1 / 60) / TAU);
        current += (target - current) * alpha;
        // clamp to valid range (down is near the end)
        const t = Math.max(0, Math.min(video.duration - 0.04, current));
        if (!seeking && Math.abs(video.currentTime - t) > 0.01) {
          video.currentTime = t;
        }
      }
      drawAmbient();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
