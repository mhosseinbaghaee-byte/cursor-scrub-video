<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cursor Gaze</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a0a0c;
      touch-action: none;
      cursor: crosshair;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #1a0a0c;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="vid" src="character-scrub.mp4" muted playsinline preload="auto"></video>
  </div>
  <script>
    const stage = document.getElementById('stage');
    const video = document.getElementById('vid');

    // Calibrated peak times from the actual clip (seconds)
    const CENTER = 0.2;
    const LOOK = {
      right: 5.0,
      down: 9.5,
      left: 2.0,
      up: 7.5,
    };

    // Calm motion
    const DEADZONE = 0.12;
    const TAU = 0.35;
    const MAX_STEP = 0.035;
    const AXIS_BIAS = 1.15;

    let ready = false;
    let seeking = false;
    let target = CENTER;
    let current = CENTER;
    let lastTs = 0;

    video.addEventListener('seeking', () => { seeking = true; });
    video.addEventListener('seeked', () => { seeking = false; });
    video.addEventListener('canplaythrough', () => { ready = true; });
    video.load();
    video.currentTime = CENTER;
    video.play().then(() => video.pause()).catch(() => {});

    function dirFromPointer(nx, ny) {
      const mag = Math.hypot(nx, ny);
      if (mag < DEADZONE) return { dir: 'center', strength: 0 };

      const ax = Math.abs(nx) * AXIS_BIAS;
      const ay = Math.abs(ny);
      let dir;
      if (ax >= ay) {
        dir = nx > 0 ? 'right' : 'left';
      } else {
        dir = ny > 0 ? 'down' : 'up';
      }
      const strength = Math.min(1, (mag - DEADZONE) / (1 - DEADZONE));
      return { dir, strength };
    }

    function setFromPointer(clientX, clientY) {
      if (!ready || !Number.isFinite(video.duration) || video.duration <= 0) return;
      const rect = stage.getBoundingClientRect();
      let nx = rect.width > 0 ? ((clientX - rect.left) / rect.width) * 2 - 1 : 0;
      let ny = rect.height > 0 ? ((clientY - rect.top) / rect.height) * 2 - 1 : 0;
      nx = Math.max(-1, Math.min(1, nx));
      ny = Math.max(-1, Math.min(1, ny));

      const { dir, strength } = dirFromPointer(nx, ny);

      if (dir === 'center' || strength <= 0) {
        target = CENTER;
        return;
      }

      const peak = LOOK[dir];
      target = CENTER + (peak - CENTER) * strength;
    }

    stage.addEventListener('pointermove', (e) => {
      setFromPointer(e.clientX, e.clientY);
    });
    stage.addEventListener('pointerdown', (e) => {
      stage.setPointerCapture(e.pointerId);
      setFromPointer(e.clientX, e.clientY);
    });
    stage.addEventListener('pointerleave', () => {
      target = CENTER;
    });

    function tick(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;

      if (ready && Number.isFinite(video.duration) && video.duration > 0) {
        const alpha = 1 - Math.exp(-dt / TAU);
        let next = current + (target - current) * alpha;
        const delta = next - current;
        if (delta > MAX_STEP) next = current + MAX_STEP;
        if (delta < -MAX_STEP) next = current - MAX_STEP;
        current = next;

        if (!seeking && Math.abs(video.currentTime - current) > 0.012) {
          video.currentTime = current;
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
