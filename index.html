<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cursor Gaze</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87030a;
      touch-action: none;
      cursor: crosshair;
      -webkit-user-select: none;
      user-select: none;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: #87030a;
      overflow: hidden;
    }
    #bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(60px) saturate(1.3) brightness(0.95);
      transform: scale(1.15);
    }
    video {
      position: relative;
      display: block;
      pointer-events: none;
      object-fit: fill;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="bg"></canvas>
    <video id="vid" src="character-scrub.mp4" muted playsinline preload="auto"></video>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const video = document.getElementById('vid');
    const bg = document.getElementById('bg');
    const bgCtx = bg.getContext('2d');

    // Deterministic pixel-exact sizing so the video's box always matches
    // its native aspect ratio exactly — no browser-painted internal
    // letterbox, no cropping. Any leftover space around it is filled by
    // the live blurred ambient backdrop below, not a flat color.
    let nativeRatio = 1280 / 704;

    function layout() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      let w, h;
      if (vw / vh > nativeRatio) {
        h = vh;
        w = Math.round(h * nativeRatio);
      } else {
        w = vw;
        h = Math.round(w / nativeRatio);
      }
      video.style.width = w + 'px';
      video.style.height = h + 'px';
      bg.width = Math.max(1, Math.round(vw / 4));
      bg.height = Math.max(1, Math.round(vh / 4));
      bg.style.width = vw + 'px';
      bg.style.height = vh + 'px';
    }

    video.addEventListener('loadedmetadata', () => {
      if (video.videoWidth && video.videoHeight) nativeRatio = video.videoWidth / video.videoHeight;
      layout();
    });
    window.addEventListener('resize', layout);
    layout();

    function drawAmbient() {
      if (video.readyState >= 2 && video.videoWidth) {
        const vAspect = video.videoWidth / video.videoHeight;
        const cAspect = bg.width / bg.height;
        let sw, sh, sx, sy;
        if (vAspect > cAspect) {
          sh = video.videoHeight;
          sw = sh * cAspect;
          sx = (video.videoWidth - sw) / 2;
          sy = 0;
        } else {
          sw = video.videoWidth;
          sh = sw / cAspect;
          sx = 0;
          sy = (video.videoHeight - sh) / 2;
        }
        try { bgCtx.drawImage(video, sx, sy, sw, sh, 0, 0, bg.width, bg.height); } catch (e) {}
      }
    }

    // Simple, robust single-axis scrub: horizontal cursor position maps
    // linearly to the video's timeline. No direction-key guessing, no
    // calibration assumptions — just a direct, predictable 1:1 feel.
    let seeking = false;
    video.addEventListener('seeking', () => { seeking = true; });
    video.addEventListener('seeked', () => { seeking = false; });
    let ready = false;
    video.addEventListener('canplaythrough', () => { ready = true; });

    let current = 0;
    let target = 0;
    const TAU = 0.22;

    function updateTarget(clientX) {
      const rect = stage.getBoundingClientRect();
      let nx = (clientX - rect.left) / rect.width;
      nx = Math.max(0, Math.min(1, nx));
      if (ready && Number.isFinite(video.duration) && video.duration > 0) {
        target = nx * video.duration;
      }
    }

    window.addEventListener('pointermove', (e) => updateTarget(e.clientX), { passive: true });
    window.addEventListener('pointerdown', (e) => updateTarget(e.clientX), { passive: true });

    function tick() {
      if (ready && Number.isFinite(video.duration) && video.duration > 0) {
        const alpha = 1 - Math.exp(-(1 / 60) / TAU);
        current += (target - current) * alpha;
        if (!seeking && Math.abs(video.currentTime - current) > 0.008) {
          video.currentTime = current;
        }
      }
      drawAmbient();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
