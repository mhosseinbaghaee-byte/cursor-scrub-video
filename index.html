<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cursor Gaze</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a0a0c;
      touch-action: none;
      cursor: crosshair;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #1a0a0c;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="vid" src="character-scrub.mp4" muted playsinline preload="auto"></video>
  </div>
  <script>
    const stage = document.getElementById('stage');
    const video = document.getElementById('vid');

    // 8-direction keyframes from 9391.mp4 (angle in radians, screen: +x right, +y down)
    const CENTER = 0.12;
    const KEYS = [
      { ang: 0,              t: 1.05 },  // right
      { ang: Math.PI / 4,    t: 2.00 },  // down-right
      { ang: Math.PI / 2,    t: 3.00 },  // down
      { ang: 3 * Math.PI / 4,t: 3.45 },  // down-left
      { ang: Math.PI,        t: 4.05 },  // left
      { ang: -3 * Math.PI / 4, t: 6.05 }, // up-left
      { ang: -Math.PI / 2,   t: 5.20 },  // up
      { ang: -Math.PI / 4,   t: 0.85 },  // up-right
    ];

    const DEADZONE = 0.07;
    const TAU = 0.14;

    let ready = false;
    let seeking = false;
    let target = CENTER;
    let current = CENTER;
    let lastTs = 0;

    video.addEventListener('seeking', () => { seeking = true; });
    video.addEventListener('seeked', () => { seeking = false; });
    video.addEventListener('canplaythrough', () => { ready = true; });
    video.load();
    video.currentTime = CENTER;
    video.play().then(() => video.pause()).catch(() => {});

    function normAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }
    function angDist(a, b) {
      return normAngle(b - a);
    }

    function timeForAngle(angle) {
      let bestI = 0;
      let bestD = Infinity;
      for (let i = 0; i < KEYS.length; i++) {
        const d = Math.abs(angDist(angle, KEYS[i].ang));
        if (d < bestD) { bestD = d; bestI = i; }
      }
      const a = KEYS[bestI];
      const residual = angDist(a.ang, angle);
      const step = residual >= 0 ? 1 : -1;
      const b = KEYS[(bestI + step + KEYS.length) % KEYS.length];
      const span = Math.abs(angDist(a.ang, b.ang)) || 1;
      const u = Math.min(1, Math.abs(residual) / span);
      const s = u * u * (3 - 2 * u);
      return a.t + (b.t - a.t) * s;
    }

    function setFromPointer(clientX, clientY) {
      if (!ready || !Number.isFinite(video.duration) || video.duration <= 0) return;
      const rect = stage.getBoundingClientRect();
      let nx = rect.width > 0 ? ((clientX - rect.left) / rect.width) * 2 - 1 : 0;
      let ny = rect.height > 0 ? ((clientY - rect.top) / rect.height) * 2 - 1 : 0;
      nx = Math.max(-1, Math.min(1, nx));
      ny = Math.max(-1, Math.min(1, ny));

      const mag = Math.hypot(nx, ny);
      if (mag < DEADZONE) {
        target = CENTER;
        return;
      }

      const angle = Math.atan2(ny, nx);
      const peak = timeForAngle(angle);
      const strength = Math.min(1, (mag - DEADZONE) / (1 - DEADZONE));
      const s = strength * strength * (3 - 2 * strength);
      target = CENTER + (peak - CENTER) * s;
    }

    stage.addEventListener('pointermove', (e) => setFromPointer(e.clientX, e.clientY));
    stage.addEventListener('pointerdown', (e) => {
      stage.setPointerCapture(e.pointerId);
      setFromPointer(e.clientX, e.clientY);
    });
    stage.addEventListener('pointerleave', () => { target = CENTER; });

    function tick(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;

      if (ready && Number.isFinite(video.duration) && video.duration > 0) {
        const alpha = 1 - Math.exp(-dt / TAU);
        current += (target - current) * alpha;
        if (!seeking && Math.abs(video.currentTime - current) > 0.008) {
          video.currentTime = current;
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
