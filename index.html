<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cursor Gaze</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87030a;
      touch-action: none;
      cursor: crosshair;
      -webkit-user-select: none;
      user-select: none;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: #87030a;
      overflow: hidden;
    }
    #bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(60px) saturate(1.3) brightness(0.95);
      transform: scale(1.15);
    }
    video {
      position: relative;
      display: block;
      pointer-events: none;
      object-fit: fill;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="bg"></canvas>
    <video id="vid" src="character-scrub.mp4" muted playsinline preload="auto"></video>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const video = document.getElementById('vid');
    const bg = document.getElementById('bg');
    const bgCtx = bg.getContext('2d');

    let nativeRatio = 1280 / 704;

    function layout() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      let w, h;
      if (vw / vh > nativeRatio) {
        h = vh;
        w = Math.round(h * nativeRatio);
      } else {
        w = vw;
        h = Math.round(w / nativeRatio);
      }
      video.style.width = w + 'px';
      video.style.height = h + 'px';
      bg.width = Math.max(1, Math.round(vw / 4));
      bg.height = Math.max(1, Math.round(vh / 4));
      bg.style.width = vw + 'px';
      bg.style.height = vh + 'px';
    }

    video.addEventListener('loadedmetadata', () => {
      if (video.videoWidth && video.videoHeight) nativeRatio = video.videoWidth / video.videoHeight;
      layout();
    });
    window.addEventListener('resize', layout);
    layout();

    function drawAmbient() {
      if (video.readyState >= 2 && video.videoWidth) {
        const vAspect = video.videoWidth / video.videoHeight;
        const cAspect = bg.width / bg.height;
        let sw, sh, sx, sy;
        if (vAspect > cAspect) {
          sh = video.videoHeight;
          sw = sh * cAspect;
          sx = (video.videoWidth - sw) / 2;
          sy = 0;
        } else {
          sw = video.videoWidth;
          sh = sw / cAspect;
          sx = 0;
          sy = (video.videoHeight - sh) / 2;
        }
        try { bgCtx.drawImage(video, sx, sy, sw, sh, 0, 0, bg.width, bg.height); } catch (e) {}
      }
    }

    // ---------------------------------------------------------------
    // Direction keyframes, measured directly from this clip by
    // tracking the face's pixel centroid across every frame:
    //   start (neutral, looking at camera): t = 0
    //   LEFT   peak: t = 2.7
    //   RIGHT  peak: t = 6.6
    //   UP     peak: t = 8.58
    //   DOWN   peak: t = 10.0  (right at the very end of the clip)
    // This clip is a straight sequence (neutral -> left -> right ->
    // up -> down), not a circular sweep, so directions are matched
    // by nearest angle rather than assumed to lie on one smooth
    // rotational path.
    // ---------------------------------------------------------------
    const KEYS = [
      { angle: 0,   t: 6.6 },   // right
      { angle: 90,  t: 10.0 },  // down
      { angle: 180, t: 2.7 },   // left
      { angle: 270, t: 8.58 },  // up
    ];
    const NEUTRAL_T = 0;
    const DEADZONE_FRAC = 0.14;

    let seeking = false;
    video.addEventListener('seeking', () => { seeking = true; });
    video.addEventListener('seeked', () => { seeking = false; });
    let ready = false;
    video.addEventListener('canplaythrough', () => { ready = true; });

    let current = 0;
    let target = 0;
    const TAU = 0.24;

    function angleDiff(a, b) {
      return ((a - b) % 360 + 540) % 360 - 180;
    }

    function updateTarget(clientX, clientY) {
      const rect = stage.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      // Per-axis normalization: reaching ANY screen edge (top, bottom,
      // left, or right) should reach full signal strength, regardless
      // of the screen's aspect ratio. A single diagonal-based radius
      // normalization under-weights vertical movement on wide screens
      // (since half-height is much smaller than the half-diagonal),
      // which made up/down feel unresponsive.
      const normX = Math.abs(dx) / (rect.width / 2);
      const normY = Math.abs(dy) / (rect.height / 2);
      const norm = Math.min(1, Math.max(normX, normY));

      let angle = Math.atan2(dy, dx) * 180 / Math.PI;
      if (angle < 0) angle += 360;

      const n = KEYS.length;
      let i0 = 0;
      for (let i = 0; i < n; i++) {
        if (angleDiff(angle, KEYS[i].angle) >= 0) i0 = i;
      }
      const i1 = (i0 + 1) % n;
      let a0 = KEYS[i0].angle;
      let a1 = KEYS[i1].angle;
      if (i1 === 0) a1 += 360;

      const span = a1 - a0;
      const frac = span > 0 ? Math.max(0, Math.min(1, (angle - a0) / span)) : 0;
      const eased = frac * frac * (3 - 2 * frac);
      const angleTarget = KEYS[i0].t + (KEYS[i1].t - KEYS[i0].t) * eased;

      const deadT = Math.max(0, Math.min(1, (norm - DEADZONE_FRAC) / (1 - DEADZONE_FRAC)));
      target = NEUTRAL_T + (angleTarget - NEUTRAL_T) * deadT;
    }

    window.addEventListener('pointermove', (e) => updateTarget(e.clientX, e.clientY), { passive: true });
    window.addEventListener('pointerdown', (e) => updateTarget(e.clientX, e.clientY), { passive: true });

    function tick() {
      if (ready && Number.isFinite(video.duration) && video.duration > 0) {
        const alpha = 1 - Math.exp(-(1 / 60) / TAU);
        current += (target - current) * alpha;
        if (!seeking && Math.abs(video.currentTime - current) > 0.008) {
          video.currentTime = current;
        }
      }
      drawAmbient();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
