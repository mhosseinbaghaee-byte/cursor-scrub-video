<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cursor Gaze</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87030a;
      touch-action: none;
      cursor: crosshair;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: #87030a;
      overflow: hidden;
    }
    #bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(60px) saturate(1.3) brightness(0.95);
      transform: scale(1.15);
    }
    video {
      position: absolute;
      display: block;
      pointer-events: none;
      object-fit: fill;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="bg"></canvas>
    <video id="gaze" src="character-gaze.mp4" muted playsinline preload="auto" loop></video>
    <video id="orbit" src="character-orbit.mp4" muted playsinline preload="auto"></video>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const gaze = document.getElementById('gaze');
    const orbit = document.getElementById('orbit');
    const bg = document.getElementById('bg');
    const bgCtx = bg.getContext('2d');

    // ---- Deterministic sizing (both clips share the same 21:9 native ratio) ----
    let nativeRatio = 2206 / 946;

    function sizeVideo(v) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      let w, h;
      if (vw / vh > nativeRatio) {
        h = vh;
        w = Math.round(h * nativeRatio);
      } else {
        w = vw;
        h = Math.round(w / nativeRatio);
      }
      v.style.width = w + 'px';
      v.style.height = h + 'px';
    }

    function layout() {
      sizeVideo(gaze);
      sizeVideo(orbit);
      bg.width = Math.max(1, Math.round(window.innerWidth / 4));
      bg.height = Math.max(1, Math.round(window.innerHeight / 4));
      bg.style.width = window.innerWidth + 'px';
      bg.style.height = window.innerHeight + 'px';
    }

    gaze.addEventListener('loadedmetadata', () => {
      if (gaze.videoWidth && gaze.videoHeight) nativeRatio = gaze.videoWidth / gaze.videoHeight;
      layout();
    });
    window.addEventListener('resize', layout);
    layout();

    // ---- Ambient blurred backdrop, driven by whichever clip is on top ----
    function drawAmbient(activeVideo) {
      if (activeVideo.readyState >= 2 && activeVideo.videoWidth) {
        const vAspect = activeVideo.videoWidth / activeVideo.videoHeight;
        const cAspect = bg.width / bg.height;
        let sw, sh, sx, sy;
        if (vAspect > cAspect) {
          sh = activeVideo.videoHeight;
          sw = sh * cAspect;
          sx = (activeVideo.videoWidth - sw) / 2;
          sy = 0;
        } else {
          sw = activeVideo.videoWidth;
          sh = sw / cAspect;
          sx = 0;
          sy = (activeVideo.videoHeight - sh) / 2;
        }
        try { bgCtx.drawImage(activeVideo, sx, sy, sw, sh, 0, 0, bg.width, bg.height); } catch (e) {}
      }
    }

    // ---- Idle (gaze) <-> Active (orbit scrub) state machine ----
    const IDLE_TIMEOUT = 1200; // ms of no pointer movement before returning to gaze
    let mode = 'idle';
    let lastMoveTs = 0;

    let current = 0;   // orbit's current smoothed time
    let target = 0;    // orbit's target time from pointer X
    let seeking = false;
    const TAU = 0.22;  // smoothing time constant

    orbit.addEventListener('seeking', () => { seeking = true; });
    orbit.addEventListener('seeked', () => { seeking = false; });

    let orbitReady = false;
    orbit.addEventListener('canplaythrough', () => { orbitReady = true; });

    gaze.play().catch(() => {});

    function enterActive() {
      if (mode === 'active') return;
      mode = 'active';
      gaze.style.opacity = '0';
      orbit.style.opacity = '1';
    }

    function enterIdle() {
      if (mode === 'idle') return;
      mode = 'idle';
      orbit.style.opacity = '0';
      gaze.style.opacity = '1';
      gaze.currentTime = 0;
      gaze.play().catch(() => {});
    }

    function updateTargetFromEvent(clientX) {
      const rect = stage.getBoundingClientRect();
      let nx = (clientX - rect.left) / rect.width;
      nx = Math.max(0, Math.min(1, nx));
      if (orbitReady && Number.isFinite(orbit.duration) && orbit.duration > 0) {
        target = nx * orbit.duration;
      }
    }

    function onPointerMove(e) {
      lastMoveTs = performance.now();
      enterActive();
      updateTargetFromEvent(e.clientX);
    }

    window.addEventListener('pointermove', onPointerMove, { passive: true });
    window.addEventListener('pointerdown', onPointerMove, { passive: true });

    function tick(ts) {
      if (mode === 'active' && ts - lastMoveTs > IDLE_TIMEOUT) {
        enterIdle();
      }

      if (mode === 'active' && orbitReady && Number.isFinite(orbit.duration) && orbit.duration > 0) {
        const alpha = 1 - Math.exp(-(1 / 60) / TAU);
        current += (target - current) * alpha;
        if (!seeking && Math.abs(orbit.currentTime - current) > 0.008) {
          orbit.currentTime = current;
        }
      }

      drawAmbient(mode === 'active' ? orbit : gaze);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
