<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cursor Gaze</title>
  <!-- build 2026-08-28-v9 -->
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a0a0c;
      touch-action: none;
      cursor: crosshair;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #1a0a0c;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="vid" src="character-scrub.mp4" muted playsinline preload="auto"></video>
  </div>
  <script>
    const stage = document.getElementById('stage');
    const video = document.getElementById('vid');

    // 8 directions from 9391.mp4 — times calibrated from frames
    // screen coords: +x right, +y down
    const CENTER = 0.15;
    const KEYS = [
      { ang: 0,               t: 1.10 }, // right
      { ang: Math.PI * 0.25,  t: 2.05 }, // down-right
      { ang: Math.PI * 0.50,  t: 3.05 }, // down
      { ang: Math.PI * 0.75,  t: 3.50 }, // down-left
      { ang: Math.PI,         t: 4.10 }, // left
      { ang: -Math.PI * 0.75, t: 6.10 }, // up-left
      { ang: -Math.PI * 0.50, t: 5.25 }, // up
      { ang: -Math.PI * 0.25, t: 0.90 }, // up-right
    ];

    const DEADZONE = 0.06;
    const SMOOTH = 0.18; // seconds time-constant

    let ready = false;
    let target = CENTER;
    let current = CENTER;
    let lastTs = 0;
    let lastSeek = 0;

    function markReady() {
      if (Number.isFinite(video.duration) && video.duration > 0) {
        ready = true;
        try { video.pause(); } catch (_) {}
      }
    }

    video.addEventListener('loadedmetadata', markReady);
    video.addEventListener('canplay', markReady);
    video.addEventListener('canplaythrough', markReady);
    video.addEventListener('loadeddata', markReady);

    video.muted = true;
    video.playsInline = true;
    video.load();
    // kick metadata
    video.play().then(() => { video.pause(); markReady(); }).catch(() => markReady());

    function nearestKey(angle) {
      let best = KEYS[0];
      let bestD = Infinity;
      for (const k of KEYS) {
        let d = angle - k.ang;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        d = Math.abs(d);
        if (d < bestD) { bestD = d; best = k; }
      }
      return best;
    }

    function setFromPointer(clientX, clientY) {
      if (!ready) markReady();
      if (!ready) return;

      const w = window.innerWidth || 1;
      const h = window.innerHeight || 1;
      let nx = (clientX / w) * 2 - 1;
      let ny = (clientY / h) * 2 - 1;
      nx = Math.max(-1, Math.min(1, nx));
      ny = Math.max(-1, Math.min(1, ny));

      const mag = Math.hypot(nx, ny);
      if (mag < DEADZONE) {
        target = CENTER;
        return;
      }

      const angle = Math.atan2(ny, nx);
      const key = nearestKey(angle);
      // strength: stronger at edges
      const strength = Math.min(1, (mag - DEADZONE) / (0.85 - DEADZONE));
      const s = strength * strength * (3 - 2 * strength); // smoothstep
      target = CENTER + (key.t - CENTER) * s;
    }

    // Listen on window so nothing can block pointer events
    window.addEventListener('pointermove', (e) => {
      setFromPointer(e.clientX, e.clientY);
    }, { passive: true });

    window.addEventListener('mousemove', (e) => {
      setFromPointer(e.clientX, e.clientY);
    }, { passive: true });

    window.addEventListener('pointerdown', (e) => {
      setFromPointer(e.clientX, e.clientY);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches[0]) {
        setFromPointer(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    function tick(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;

      if (!ready) markReady();

      if (ready) {
        const alpha = 1 - Math.exp(-dt / SMOOTH);
        current += (target - current) * alpha;

        // throttle seeks a bit for smoother decode
        const now = performance.now();
        if (Math.abs(video.currentTime - current) > 0.02 && (now - lastSeek) > 16) {
          try {
            video.currentTime = current;
            lastSeek = now;
          } catch (_) {}
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
