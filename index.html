<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cursor Gaze</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a0a0c;
      touch-action: none;
      cursor: crosshair;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #1a0a0c;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="vid" src="character-scrub.mp4" muted playsinline preload="auto"></video>
  </div>
  <script>
    const stage = document.getElementById('stage');
    const video = document.getElementById('vid');

    // Peak look times in the 10s clip (left → right → up → down)
    const LOOK = { left: 1.25, right: 3.75, up: 6.25, down: 8.75 };
    const NEUTRAL = 0.15;
    const SMOOTH = 0.28;

    let ready = false;
    let seeking = false;
    let target = NEUTRAL;
    let current = NEUTRAL;

    video.addEventListener('seeking', () => { seeking = true; });
    video.addEventListener('seeked', () => { seeking = false; });
    video.addEventListener('canplaythrough', () => { ready = true; });
    video.load();
    video.currentTime = NEUTRAL;
    video.play().then(() => video.pause()).catch(() => {});

    function setFromPointer(clientX, clientY) {
      if (!ready || !Number.isFinite(video.duration) || video.duration <= 0) return;
      const rect = stage.getBoundingClientRect();
      // -1..1 relative to center (screen Y grows downward)
      let nx = rect.width > 0 ? ((clientX - rect.left) / rect.width) * 2 - 1 : 0;
      let ny = rect.height > 0 ? ((clientY - rect.top) / rect.height) * 2 - 1 : 0;
      nx = Math.max(-1, Math.min(1, nx));
      ny = Math.max(-1, Math.min(1, ny));

      const mag = Math.hypot(nx, ny);
      if (mag < 0.08) {
        target = NEUTRAL;
        return;
      }

      // Directional weights: mouse right → look right, left → left, up → up, down → down
      let wL = Math.max(0, -nx);
      let wR = Math.max(0, nx);
      let wU = Math.max(0, -ny);
      let wD = Math.max(0, ny);
      // Sharpen so the dominant direction wins more clearly
      wL *= wL; wR *= wR; wU *= wU; wD *= wD;
      const sum = wL + wR + wU + wD || 1;
      target =
        (wL * LOOK.left + wR * LOOK.right + wU * LOOK.up + wD * LOOK.down) / sum;
    }

    stage.addEventListener('pointermove', (e) => {
      setFromPointer(e.clientX, e.clientY);
    });
    stage.addEventListener('pointerdown', (e) => {
      stage.setPointerCapture(e.pointerId);
      setFromPointer(e.clientX, e.clientY);
    });

    function tick() {
      if (ready && Number.isFinite(video.duration) && video.duration > 0) {
        current += (target - current) * SMOOTH;
        if (!seeking && Math.abs(video.currentTime - current) > 0.01) {
          video.currentTime = current;
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
