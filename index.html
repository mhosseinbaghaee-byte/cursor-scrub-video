<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursor Gaze</title>
  <style>
    :root {
      --bg: #1a0a0c;
      --surface: #2a1216;
      --fg: #f4e8e4;
      --muted: #c4a8a4;
      --primary: #c41e3a;
      --border: #4a2024;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      margin: 0.25rem 0 0.5rem;
    }
    p { color: var(--muted); line-height: 1.6; max-width: 36rem; }
    .stage {
      margin-top: 1.25rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      aspect-ratio: 16 / 9;
      position: relative;
      touch-action: none;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .hint {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .badge {
      display: inline-block;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">CursorScrubVideo</span>
    <h1>موس را حرکت بده</h1>
    <p>کاراکتر با موقعیت نشانگر نگاه می‌کند. ویدیو پخش نمی‌شود؛ فقط اسکرول می‌شود.</p>
    <div class="stage" id="stage">
      <video id="vid" src="character-scrub.mp4" muted playsinline preload="auto"></video>
    </div>
    <p class="hint">چپ / راست / بالا / پایین = نگاه کاراکتر</p>
  </main>
  <script>
    const stage = document.getElementById('stage');
    const video = document.getElementById('vid');
    let ready = false;
    let seeking = false;
    let target = 0;
    let current = 0;
    const smoothing = 0.22;

    video.addEventListener('seeking', () => { seeking = true; });
    video.addEventListener('seeked', () => { seeking = false; });
    video.addEventListener('canplaythrough', () => { ready = true; });
    video.load();
    video.currentTime = 0;
    video.play().then(() => video.pause()).catch(() => {});

    stage.addEventListener('pointermove', (e) => {
      if (!ready || !Number.isFinite(video.duration) || video.duration <= 0) return;
      const rect = stage.getBoundingClientRect();
      let x = rect.width > 0 ? (e.clientX - rect.left) / rect.width : 0;
      x = Math.min(1, Math.max(0, x));
      target = x * video.duration;
    });

    function tick() {
      if (ready && Number.isFinite(video.duration) && video.duration > 0) {
        current += (target - current) * smoothing;
        if (!seeking && Math.abs(video.currentTime - current) > 0.008) {
          video.currentTime = current;
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
